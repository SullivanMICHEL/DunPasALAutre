<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>Tracker équipage</title>

<style>

body{
font-family: Arial, Helvetica, sans-serif;
background:#f4f6f8;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.tracker-container{
background:white;
padding:40px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
max-width:380px;
width:90%;
text-align:center;
}

h1{
margin-bottom:10px;
}

p{
color:#555;
font-size:14px;
}

input{
width:100%;
padding:12px;
margin-top:15px;
border-radius:6px;
border:1px solid #ddd;
font-size:14px;
}

button{
width:100%;
padding:12px;
margin-top:15px;
border:none;
border-radius:6px;
background:#e63946;
color:white;
font-weight:bold;
cursor:pointer;
transition:0.2s;
}

button:hover{
background:#c92f3c;
}

.status{
margin-top:25px;
padding:15px;
border-radius:8px;
background:#e8f7ee;
color:#1f7a46;
display:none;
}

.status span{
display:block;
margin-top:5px;
font-size:13px;
color:#555;
}

</style>

</head>


<body>

<div class="tracker-container">

<h1>Tracker véhicule</h1>

<p>
Entrer le mot de passe pour activer le suivi GPS
</p>

<input type="password" id="password" placeholder="Mot de passe">

<button onclick="checkPassword()">Activer le tracker</button>

<div class="status" id="status">
📍 Position GPS envoyée
<span id="coords"></span>
</div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"
import { getDatabase, ref, get, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"


// CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCnzi4kCMp-PaU57v-cSfqr-uKWU_LkCx0",
  databaseURL: "https://dun-pas-a-lautre-tracker-default-rtdb.firebaseio.com",
};

const app = initializeApp(firebaseConfig)

const db = getDatabase(app)

// Vérifie si déjà connecté
if(localStorage.getItem("trackerAuth") === "ok"){
startTracking()
document.getElementById("status").style.display="block"
}

// Vérification mot de passe
window.checkPassword = async function(){

const inputPassword = document.getElementById("password").value

const snapshot = await get(ref(db,"tracker_password"))

const realPassword = snapshot.val()

if(inputPassword === realPassword){

localStorage.setItem("trackerAuth","ok")

startTracking()

document.getElementById("status").style.display="block"

}else{

alert("Mot de passe incorrect")

}

}



// Fonction tracker GPS
function startTracking(){

if(!navigator.geolocation){

alert("La géolocalisation n'est pas supportée")

return

}

navigator.geolocation.watchPosition(

(position)=>{

const lat = position.coords.latitude
const lng = position.coords.longitude

push(ref(db,"car_positions"),{

lat:lat,
lng:lng,
time:Date.now()

})

// affichage position
document.getElementById("coords").innerHTML =
"Lat : "+lat.toFixed(5)+" | Lng : "+lng.toFixed(5)

console.log("Position envoyée :",lat,lng)

},

(error)=>{

console.error(error)

},

{
enableHighAccuracy:true,
maximumAge:5000,
timeout:10000
}

)

}

</script>

</body>

</html>
