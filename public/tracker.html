<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tracker — D'un Pas à l'autre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #e63946;
      --red-dk: #c1121f;
      --navy:   #0d2c80;
      --dark:   #0a0f1e;
      --card:   #111827;
      --border: rgba(255,255,255,0.08);
      --muted:  rgba(255,255,255,0.4);
      --green:  #22c55e;
      --amber:  #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Mono', monospace;
      background: var(--dark);
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* grille subtile en fond */
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── En-tête ── */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header-tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.1;
    }
    .header h1 span { color: var(--red); }

    /* ── Carte principale ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      width: 100%;
      max-width: 420px;
      position: relative;
      overflow: hidden;
    }
    /* accent décoratif */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--red), var(--navy));
    }

    /* ── Écran de login ── */
    #screen-login { display: flex; flex-direction: column; gap: 20px; }

    .field label {
      display: block;
      font-size: 10px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 13px 16px;
      color: white;
      font-family: 'DM Mono', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    .field input:focus { border-color: var(--red); }
    .field input::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .05em;
      cursor: pointer;
      transition: background .2s, transform .1s;
    }
    .btn:hover  { background: var(--red-dk); }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      font-size: 12px;
      color: #f87171;
      text-align: center;
      display: none;
      padding: 10px;
      background: rgba(239,68,68,.1);
      border-radius: 6px;
      border: 1px solid rgba(239,68,68,.2);
    }

    /* ── Écran tracker ── */
    #screen-tracker { display: none; flex-direction: column; gap: 24px; }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .status-label {
      font-family: 'Syne', sans-serif;
      font-size: 16px;
      font-weight: 700;
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid;
    }
    .badge.active   { color: var(--green); border-color: rgba(34,197,94,.3); background: rgba(34,197,94,.08); }
    .badge.inactive { color: var(--muted); border-color: var(--border); }
    .badge.error    { color: #f87171;      border-color: rgba(248,113,113,.3); background: rgba(248,113,113,.08); }

    /* Point clignotant */
    .dot-live {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: .4; transform: scale(.7); }
    }

    /* Grille de stats */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .stat-box {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .stat-box .stat-label {
      font-size: 9px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat-box .stat-value {
      font-size: 14px;
      font-weight: 500;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .stat-box .stat-value.big {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 700;
    }

    /* Barre d'activité */
    .activity-log {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      max-height: 130px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .activity-log::-webkit-scrollbar { width: 4px; }
    .activity-log::-webkit-scrollbar-track { background: transparent; }
    .activity-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .log-line {
      display: flex;
      gap: 10px;
      font-size: 11px;
      color: var(--muted);
      align-items: flex-start;
    }
    .log-line .log-time { color: var(--red); flex-shrink: 0; }
    .log-line.success .log-msg { color: rgba(34,197,94,.9); }
    .log-line.warn    .log-msg { color: var(--amber); }
    .log-line.err     .log-msg { color: #f87171; }

    /* Bouton stop */
    .btn-stop {
      background: transparent;
      border: 1px solid rgba(239,68,68,.3);
      color: #f87171;
    }
    .btn-stop:hover { background: rgba(239,68,68,.08); border-color: #f87171; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-tag">Rallye 205 Trophée</div>
    <h1>Tracker <span>équipage</span></h1>
  </div>

  <div class="card">

    <!-- ── Écran login ── -->
    <div id="screen-login">
      <div class="field">
        <label>Mot de passe équipage</label>
        <input type="password" id="password" placeholder="••••••••"
               onkeydown="if(event.key==='Enter') login()">
      </div>
      <div class="error-msg" id="error-msg">Mot de passe incorrect</div>
      <button class="btn" id="btn-login" onclick="login()">Activer le tracking</button>
    </div>

    <!-- ── Écran tracker ── -->
    <div id="screen-tracker">

      <div class="status-header">
        <span class="status-label">Suivi GPS</span>
        <div class="badge active" id="status-badge">
          <span class="dot-live" id="dot-live"></span>
          <span id="status-text">En ligne</span>
        </div>
      </div>

      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-label">Latitude</div>
          <div class="stat-value" id="stat-lat">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Longitude</div>
          <div class="stat-value" id="stat-lng">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Précision</div>
          <div class="stat-value" id="stat-acc">—</div>
        </div>
        <div class="stat-box">
          <div class="stat-label">Envois réussis</div>
          <div class="stat-value big" id="stat-count">0</div>
        </div>
      </div>

      <div class="activity-log" id="activity-log">
        <div class="log-line">
          <span class="log-time">--:--</span>
          <span class="log-msg">En attente de signal GPS...</span>
        </div>
      </div>

      <button class="btn btn-stop" onclick="stopTracking()">Arrêter le tracking</button>

    </div>
  </div>

<script>
  // URL de ton Cloudflare Worker
  const WORKER_URL = "https://worker-tracker-205trophee.sullivan-michel.workers.dev/position";

  // Mot de passe équipage (côté client, pour bloquer l'interface)
  // Le vrai contrôle de sécurité se fait via GPS_TOKEN dans le Worker
  const APP_PASSWORD = "rallye205";

  // Token envoyé au Worker (doit correspondre à GPS_TOKEN dans Cloudflare)
  const GPS_TOKEN = "Alice205";

  // Intervalle d'envoi en secondes (30s recommandé pendant le rallye)
  const SEND_INTERVAL_SEC = 30;

  // ─────────────────────────────────────────────────────────────────

  let watchId   = null;
  let sendCount = 0;
  let lastPos   = null;
  let sendTimer = null;

  // Auto-login si déjà authentifié
  if (sessionStorage.getItem("trackerAuth") === "ok") showTracker();

  function login() {
    const pwd = document.getElementById("password").value;
    const btn = document.getElementById("btn-login");
    const err = document.getElementById("error-msg");

    if (pwd === APP_PASSWORD) {
      sessionStorage.setItem("trackerAuth", "ok");
      err.style.display = "none";
      showTracker();
    } else {
      err.style.display = "block";
      btn.style.animation = "none";
      // petite vibration visuelle
      document.querySelector(".card").style.transform = "translateX(-4px)";
      setTimeout(() => document.querySelector(".card").style.transform = "", 120);
    }
  }

  function showTracker() {
    document.getElementById("screen-login").style.display  = "none";
    document.getElementById("screen-tracker").style.display = "flex";
    startTracking();
  }

  function startTracking() {
    if (!navigator.geolocation) {
      setStatus("error", "GPS non supporté");
      addLog("err", "Ce navigateur ne supporte pas la géolocalisation");
      return;
    }

    addLog("", "Acquisition du signal GPS...");

    watchId = navigator.geolocation.watchPosition(
      (pos) => {
        lastPos = pos;
        updateStats(pos);
        setStatus("active", "En ligne");
      },
      (err) => {
        const msgs = {
          1: "Permission refusée — autorise la localisation dans le navigateur",
          2: "Signal GPS indisponible",
          3: "Délai d'attente dépassé",
        };
        addLog("err", msgs[err.code] || "Erreur GPS inconnue");
        setStatus("error", "Erreur GPS");
      },
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
    );

    // Envoi périodique
    sendTimer = setInterval(() => {
      if (lastPos) sendPosition(lastPos);
    }, SEND_INTERVAL_SEC * 1000);

    // Premier envoi dès que la position est connue
    navigator.geolocation.getCurrentPosition(
      (pos) => { lastPos = pos; sendPosition(pos); },
      () => {}
    );
  }

  function updateStats(pos) {
    document.getElementById("stat-lat").textContent = pos.coords.latitude.toFixed(5);
    document.getElementById("stat-lng").textContent = pos.coords.longitude.toFixed(5);
    document.getElementById("stat-acc").textContent =
      pos.coords.accuracy ? Math.round(pos.coords.accuracy) + " m" : "—";
  }

  async function sendPosition(pos) {
    const { latitude: lat, longitude: lng, accuracy, speed } = pos.coords;

    // Récupère batterie si disponible (API Battery, pas tous les navigateurs)
    let battery = null;
    try {
      if (navigator.getBattery) {
        const b = await navigator.getBattery();
        battery = Math.round(b.level * 100);
      }
    } catch (_) {}

    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-GPS-Token": GPS_TOKEN,
        },
        body: JSON.stringify({
          lat,
          lng,
          accuracy: accuracy ? Math.round(accuracy) : null,
          speed: speed ? speed.toFixed(1) : null,
          battery,
        }),
      });

      if (res.ok) {
        sendCount++;
        document.getElementById("stat-count").textContent = sendCount;
        addLog("success", `Position envoyée — ${lat.toFixed(4)}, ${lng.toFixed(4)}`);
        setStatus("active", "En ligne");
      } else {
        addLog("warn", `Erreur serveur (${res.status}) — nouvelle tentative dans ${SEND_INTERVAL_SEC}s`);
        setStatus("error", "Erreur envoi");
      }
    } catch (_) {
      addLog("warn", "Réseau indisponible — réessai automatique");
      setStatus("error", "Hors ligne");
    }
  }

  function stopTracking() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    if (sendTimer !== null) clearInterval(sendTimer);
    sessionStorage.removeItem("trackerAuth");
    addLog("warn", "Tracking arrêté");
    setStatus("inactive", "Arrêté");
    document.querySelector(".btn-stop").disabled = true;
  }

  function setStatus(type, text) {
    const badge = document.getElementById("status-badge");
    const dot   = document.getElementById("dot-live");
    badge.className = "badge " + type;
    document.getElementById("status-text").textContent = text;
    dot.style.display = type === "active" ? "block" : "none";
  }

  function addLog(type, msg) {
    const log  = document.getElementById("activity-log");
    const time = new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    const line = document.createElement("div");
    line.className = "log-line " + type;
    line.innerHTML = `<span class="log-time">${time}</span><span class="log-msg">${msg}</span>`;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  // Empêche l'écran de se mettre en veille (API Wake Lock)
  async function keepAwake() {
    try {
      if ("wakeLock" in navigator) {
        await navigator.wakeLock.request("screen");
      }
    } catch (_) {}
  }
  keepAwake();
</script>
</body>
</html>
